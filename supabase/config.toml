# Supabase CLI configuration — Technical Learning Platform
#
# DB-TOOLING-1. This file exists so `supabase link` and `supabase db push` work
# from a fresh clone without per-machine setup knowledge. It is deliberately
# almost empty, and the reasons are worth stating.
#
# ## Why only project_id
#
# `project_id` is the one key the CLI has always required. Everything else in a
# generated `config.toml` configures the LOCAL Supabase stack — the Postgres,
# Studio, Storage, Realtime, Auth and Edge Runtime containers that
# `supabase start` runs on a developer machine.
#
# This project's migration workflow is remote-only: link a development project,
# preview with `supabase migration list`, apply with `supabase db push`. Nothing
# in that path reads a local-stack setting. Every key we could add would be
# configuration for a service we do not run.
#
# It is also the safer choice for a second reason. The CLI is not installed in
# this repository and is not a dependency, so this file has never been validated
# by the tool that consumes it. A large generated config carries a large surface
# of version-sensitive keys; a file with one long-stable key carries almost
# none, and any unknown-field error is impossible by construction.
#
# If a future work package genuinely needs the local stack, that is when the
# corresponding sections should be added — generated by the CLI, and reviewed.
#
# ## What project_id is NOT
#
# It is **not** the remote Supabase project ref, and this file must never
# contain one. `project_id` is a local label the CLI uses to namespace local
# Docker containers so two checkouts do not collide.
#
# The remote project ref is written by `supabase link` into
# `supabase/.temp/`, which `.gitignore` already excludes. That is what keeps
# this repository unbound to any single Supabase project: a Founder can link a
# development project today and a different one tomorrow without a commit.
#
# ## Secrets
#
# There are none here and there must never be any. The database password, the
# service-role key, the anon key and the access token are all entered
# interactively by the Founder or held in `.env.local`, which is gitignored.
# See docs/Engineering-OS/DATABASE_MIGRATION_WORKFLOW.md.

project_id = "technical-learning-platform"

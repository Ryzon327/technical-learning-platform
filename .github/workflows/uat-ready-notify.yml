name: Founder UAT Ready Notification

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  pull_request_review:
    types: [submitted]
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pull-requests: read
  issues: write

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Notify when a PR is Founder-UAT ready
        uses: actions/github-script@v7
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const topic = process.env.NTFY_TOPIC;

            if (!topic) {
              core.setFailed('Missing repository secret NTFY_TOPIC');
              return;
            }

            let numbers = [];

            if (context.eventName === 'workflow_run') {
              const run = context.payload.workflow_run;
              if (run.conclusion !== 'success') {
                core.info('CI did not succeed; no UAT notification.');
                return;
              }
              numbers = (run.pull_requests || []).map((pr) => pr.number);
            } else if (context.eventName === 'pull_request_review') {
              numbers = [context.payload.pull_request.number];
            } else {
              const open = await github.paginate(github.rest.pulls.list, {
                owner,
                repo,
                state: 'open',
                per_page: 100,
              });
              numbers = open.map((pr) => pr.number);
            }

            numbers = [...new Set(numbers)];

            for (const number of numbers) {
              const { data: pr } = await github.rest.pulls.get({
                owner,
                repo,
                pull_number: number,
              });

              if (pr.state !== 'open') continue;

              const headSha = pr.head.sha;

              const { data: runData } =
                await github.rest.actions.listWorkflowRunsForRepo({
                  owner,
                  repo,
                  head_sha: headSha,
                  event: 'pull_request',
                  per_page: 100,
                });

              const ciGreen = runData.workflow_runs.some(
                (run) =>
                  run.name === 'CI' &&
                  run.status === 'completed' &&
                  run.conclusion === 'success'
              );

              if (!ciGreen) {
                core.info(`PR #${number}: exact-head CI is not green yet.`);
                continue;
              }

              const reviews = await github.paginate(github.rest.pulls.listReviews, {
                owner,
                repo,
                pull_number: number,
                per_page: 100,
              });

              const cleanOpenHandsReview = reviews.some((review) => {
                const body = review.body || '';
                return (
                  review.commit_id === headSha &&
                  body.includes('AI agent (OpenHands)') &&
                  body.includes('✅ APPROVED')
                );
              });

              if (!cleanOpenHandsReview) {
                core.info(`PR #${number}: no clean OpenHands approval on current head.`);
                continue;
              }

              const threadData = await github.graphql(
                `
                  query($owner: String!, $repo: String!, $number: Int!) {
                    repository(owner: $owner, name: $repo) {
                      pullRequest(number: $number) {
                        reviewThreads(first: 100) {
                          nodes {
                            isResolved
                          }
                        }
                      }
                    }
                  }
                `,
                { owner, repo, number }
              );

              const threads =
                threadData.repository.pullRequest.reviewThreads.nodes || [];
              if (threads.some((thread) => !thread.isResolved)) {
                core.info(`PR #${number}: unresolved review threads remain.`);
                continue;
              }

              const marker = `<!-- founder-uat-ready:${headSha} -->`;
              const comments = await github.paginate(
                github.rest.issues.listComments,
                {
                  owner,
                  repo,
                  issue_number: number,
                  per_page: 100,
                }
              );

              if (comments.some((comment) => (comment.body || '').includes(marker))) {
                core.info(`PR #${number}: notification already sent for ${headSha}.`);
                continue;
              }

              const prettyRepo = repo
                .split('-')
                .map((word) => word.charAt(0).toUpperCase() + word.slice(1))
                .join(' ');

              const response = await fetch(
                `https://ntfy.sh/${encodeURIComponent(topic)}`,
                {
                  method: 'POST',
                  headers: {
                    Title: `${prettyRepo} ready for Founder UAT`,
                    Priority: 'high',
                    Tags: 'white_check_mark,rocket',
                    Click: pr.html_url,
                  },
                  body:
                    `PR #${number} is ready for Founder UAT. ` +
                    'Claude work is complete, Codex review is clean, CI passed, ' +
                    'and there are no unresolved review threads.',
                }
              );

              if (!response.ok) {
                throw new Error(
                  `ntfy notification failed: ${response.status} ${response.statusText}`
                );
              }

              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: number,
                body:
                  `${marker}\n📱 Founder UAT-ready phone notification sent for ` +
                  `current head \`${headSha.slice(0, 12)}\`.`,
              });

              core.info(`PR #${number}: Founder UAT notification sent.`);
            }
